name: Marketing Attribution Pipeline
on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python src/generate_marketing_data.py
      - run: python src/attribution_models.py
      - run: python src/cac_ltv.py
